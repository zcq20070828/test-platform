# 测试中台 · Nginx 站点配置模板（2026-11-24）
#
# 为什么要有这个模板文件：
#   生产曾出现 `POST /api/tasks → 413 Request Entity Too Large`（响应体是 Nginx
#   自带的 585 字节 HTML 错误页）。根因是 client_max_body_size **完全未设置**，
#   Nginx 用默认 1MB，而前端把附件转 base64 随 JSON 提交（4.3MB docx → 约 5.9MB
#   请求体），1MB 直接被拦。
#
#   只改现场不够——下次换机器/重装 Nginx 还会踩。所以配置入库，
#   由 backend/test/upload-size-limits.test.mjs 守着，防止被删掉或改小。
#
# 部署到目标机：
#   cp deploy/nginx-test-platform.conf /etc/nginx/conf.d/test-platform.conf
#   nginx -t && nginx -s reload
#
# 三处上限必须同口径（改一处就要同步改另两处）：
#   Nginx   client_max_body_size        50m   ← 本文件
#   后端    /api/tasks express.json     50mb  ← backend/server.js 的 jsonLarge
#   前端    MAX_ATTACHMENT_SIZE         35MB  ← frontend/src/utils/attachment.ts
#           （35MB × 1.36 base64 膨胀 ≈ 47.6MB，留在 50MB 以内）

# HTTP 服务器 - 用于 ACME 验证和重定向
server {
    listen 80;
    server_name aitestplatform.com.cn 42.194.137.114;

    # Let's Encrypt ACME 挑战目录
    location /.well-known/acme-challenge/ {
        root /var/www/aitestplatform;
        allow all;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务器 - Let's Encrypt 正式证书
server {
    listen 443 ssl;
    listen 8443 ssl;

    # ★ 请求体上限（2026-11-24 新增，不可删）
    # 前端把附件转 base64 一并提交，体积约为原始文件的 1.34~1.36 倍。
    # 不设置时 Nginx 默认 1MB，任何带附件的任务提交都会 413。
    # 与后端 /api/tasks 的 50MB 对齐；前端单文件上限 35MB 反算自这里。
    client_max_body_size 50m;

    server_name aitestplatform.com.cn 42.194.137.114;

    ssl_certificate /etc/letsencrypt/live/aitestplatform.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aitestplatform.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长任务（生成/审核/修复）可能跑几十分钟，超时不能太短
        proxy_read_timeout 3600s;
    }
}
