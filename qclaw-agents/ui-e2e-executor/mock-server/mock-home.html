<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 用户管理系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }
        header {
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }
        .logo { font-size: 20px; font-weight: 600; color: #667eea; }
        .user-menu { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .user-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; display: flex; align-items: center;
            justify-content: center; font-size: 16px; font-weight: 600;
        }
        .user-name { font-size: 14px; color: #333; }
        .main-content {
            max-width: 1200px; margin: 40px auto; padding: 0 24px;
        }
        .welcome-card {
            background: white; border-radius: 12px; padding: 40px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .welcome-title {
            font-size: 24px; color: #333; margin-bottom: 12px;
        }
        .welcome-subtitle {
            font-size: 14px; color: #999;
        }
        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 24px; margin-top: 24px;
        }
        .stat-card {
            background: #f8faff; border-radius: 8px; padding: 20px;
            border: 1px solid #eef0f5;
        }
        .stat-value { font-size: 28px; font-weight: 700; color: #667eea; }
        .stat-label { font-size: 13px; color: #999; margin-top: 4px; }
        .logout-btn {
            padding: 6px 16px; border: 1px solid #e0e0e0;
            border-radius: 6px; background: white; cursor: pointer;
            font-size: 13px; color: #666;
        }
        .logout-btn:hover { color: #ff4757; border-color: #ff4757; }
        [data-testid="home-container"] { min-height: 100vh; }
    </style>
</head>
<body>
    <div data-testid="home-container">
        <header>
            <div class="logo" data-testid="logo">用户管理系统</div>
            <div style="display:flex;align-items:center;gap:16px;">
                <div class="user-menu" data-testid="user-menu">
                    <div class="user-avatar" data-testid="user-avatar">管</div>
                    <span class="user-name" data-testid="user-name" id="displayName">管理员</span>
                </div>
                <button class="logout-btn" data-testid="logout-button" id="logoutBtn">退出登录</button>
            </div>
        </header>
        <div class="main-content">
            <div class="welcome-card">
                <h1 class="welcome-title" data-testid="welcome-message" id="welcomeMessage">
                    欢迎回来，<span id="welcomeName">管理员</span>
                </h1>
                <p class="welcome-subtitle">您已成功登录系统，可以开始您的管理工作。</p>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value">128</div>
                        <div class="stat-label">今日活跃用户</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">36</div>
                        <div class="stat-label">新增注册</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">7</div>
                        <div class="stat-label">待处理工单</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // 从 localStorage 读取登录信息
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        const username = localStorage.getItem('username');
        const displayName = localStorage.getItem('displayName');

        if (!isLoggedIn || !username) {
            // 未登录，重定向到登录页
            window.location.href = '/login';
        } else {
            // 显示欢迎信息
            document.getElementById('displayName').textContent = displayName || username;
            document.getElementById('welcomeName').textContent = displayName || username;
        }

        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('username');
            localStorage.removeItem('displayName');
            window.location.href = '/login';
        });
    </script>
</body>
</html>
