<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP用户注册</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 400px; padding: 20px; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 32px; }
        h1 { font-size: 24px; text-align: center; margin-bottom: 24px; color: #333; }
        .tabs { display: flex; margin-bottom: 24px; border-bottom: 1px solid #eee; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; color: #666; border-bottom: 2px solid transparent; transition: all 0.3s; }
        .tab.active { color: #007bff; border-bottom-color: #007bff; font-weight: 500; }
        .tab:hover { color: #007bff; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; color: #666; margin-bottom: 8px; }
        input { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #007bff; }
        input.error { border-color: #dc3545; }
        input.password-visible { font-family: text; letter-spacing: 2px; }
        .error-msg { font-size: 12px; color: #dc3545; margin-top: 4px; display: none; }
        .input-group { display: flex; gap: 8px; }
        .input-group input { flex: 1; }
        .btn-sms { padding: 12px 16px; background: #007bff; color: #fff; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap; min-width: 110px; }
        .btn-sms:disabled { background: #ccc; cursor: not-allowed; }
        .btn-sms.counting { background: #6c757d; }
        .btn-submit { width: 100%; padding: 14px; background: #007bff; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 24px; transition: background 0.3s; }
        .btn-submit:hover { background: #0056b3; }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
        .btn-submit.secondary { background: #28a745; }
        .btn-submit.secondary:hover { background: #218838; }
        .agreements { margin: 16px 0; }
        .agreement-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .agreement-row input[type="checkbox"] { width: auto; }
        .agreement-row label { margin: 0; font-size: 14px; }
        .link { color: #007bff; cursor: pointer; text-decoration: underline; }
        .message { padding: 12px; border-radius: 8px; margin-bottom: 16px; text-align: center; display: none; }
        .message.success { background: #d4edda; color: #155724; display: block; }
        .message.error { background: #f8d7da; color: #721c24; display: block; }
        .third-party { margin-top: 24px; padding-top: 24px; border-top: 1px solid #eee; }
        .third-party-title { text-align: center; color: #666; font-size: 14px; margin-bottom: 16px; }
        .third-party-btns { display: flex; gap: 12px; }
        .btn-third { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }
        .btn-third:hover { background: #f8f8f8; }
        .btn-wechat { color: #07c160; }
        .btn-apple { color: #000; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal.show { display: flex; }
        .modal-content { background: #fff; border-radius: 12px; padding: 24px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-header { font-size: 18px; font-weight: 500; margin-bottom: 16px; }
        .modal-close { float: right; cursor: pointer; font-size: 24px; line-height: 1; }
        .password-toggle { position: relative; }
        .password-toggle .toggle-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666; }
        .hidden { display: none !important; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>用户注册</h1>
            <div id="message" class="message"></div>
            
            <div class="tabs">
                <div class="tab active" data-tab="phone">手机号注册</div>
                <div class="tab" data-tab="email">邮箱注册</div>
            </div>
            
            <!-- 手机号注册表单 -->
            <form id="phone-form" class="tab-content">
                <div class="form-group">
                    <label>手机号</label>
                    <input type="tel" id="phone" placeholder="请输入手机号" maxlength="11" autocomplete="off">
                    <div class="error-msg" id="phone-error">手机号格式不正确</div>
                </div>
                <div class="form-group">
                    <label>验证码</label>
                    <div class="input-group">
                        <input type="text" id="phone-code" placeholder="请输入验证码" maxlength="6" autocomplete="off">
                        <button type="button" class="btn-sms" id="btn-send-code">获取验证码</button>
                    </div>
                    <div class="error-msg" id="code-error">验证码错误</div>
                </div>
                <div class="agreements">
                    <div class="agreement-row">
                        <input type="checkbox" id="agree-user">
                        <label for="agree-user">我已阅读并同意 <span class="link" data-type="user">《用户协议》</span></label>
                    </div>
                    <div class="agreement-row">
                        <input type="checkbox" id="agree-privacy">
                        <label for="agree-privacy">我已阅读并同意 <span class="link" data-type="privacy">《隐私政策》</span></label>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="phone-submit" disabled>注册</button>
            </form>
            
            <!-- 邮箱注册表单 -->
            <form id="email-form" class="tab-content hidden">
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱" autocomplete="off">
                    <div class="error-msg" id="email-error">邮箱格式不正确</div>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <div class="password-toggle">
                        <input type="password" id="password" placeholder="8-20位，需包含字母和数字">
                        <span class="toggle-icon" id="toggle-password">👁</span>
                    </div>
                    <div class="error-msg" id="password-error">密码强度不足</div>
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="confirm-password" placeholder="请再次输入密码">
                    <div class="error-msg" id="confirm-error">两次密码不一致</div>
                </div>
                <div class="agreements">
                    <div class="agreement-row">
                        <input type="checkbox" id="agree-user-email">
                        <label for="agree-user-email">我已阅读并同意 <span class="link" data-type="user">《用户协议》</span></label>
                    </div>
                    <div class="agreement-row">
                        <input type="checkbox" id="agree-privacy-email">
                        <label for="agree-privacy-email">我已阅读并同意 <span class="link" data-type="privacy">《隐私政策》</span></label>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="email-submit" disabled>注册</button>
            </form>
            
            <div class="third-party">
                <div class="third-party-title">其他登录方式</div>
                <div class="third-party-btns">
                    <button type="button" class="btn-third btn-wechat" id="btn-wechat">微信登录</button>
                    <button type="button" class="btn-third btn-apple" id="btn-apple">Apple登录</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 协议弹窗 -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="modal-close" id="modal-close">×</span>
            <div class="modal-header" id="modal-title">用户协议</div>
            <div id="modal-body" style="line-height: 1.6; color: #333;">
                <p>这里是协议内容...</p>
            </div>
        </div>
    </div>
    
    <script>
        // 模拟后端数据
        const mockBackend = {
            smsCodes: {},
            users: [],
            sendCount: {},
            lastSendTime: {},
            verifyAttempts: {},
            sendCodeCount: {}
        };
        
        // 验证规则
        const validators = {
            phone: (v) => /^1[3-9]\d{9}$/.test(v),
            email: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),
            password: (v) => /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,20}$/.test(v) && !['12345678', 'password', 'admin888', 'qwertyui'].includes(v),
            code: (v) => /^\d{6}$/.test(v)
        };
        
        // 弱口令检测
        const weakPasswords = ['12345678', 'password', 'admin888', 'qwertyui', 'abcdefgh', '11111111'];
        
        // DOM元素
        const elements = {
            tabs: document.querySelectorAll('.tab'),
            phoneForm: document.getElementById('phone-form'),
            emailForm: document.getElementById('email-form'),
            message: document.getElementById('message'),
            modal: document.getElementById('modal'),
            modalTitle: document.getElementById('modal-title'),
            modalBody: document.getElementById('modal-body'),
            modalClose: document.getElementById('modal-close')
        };
        
        // Tab切换
        elements.tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                elements.tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const tabName = tab.dataset.tab;
                elements.phoneForm.classList.toggle('hidden', tabName !== 'phone');
                elements.emailForm.classList.toggle('hidden', tabName !== 'email');
                hideMessage();
            });
        });
        
        // 协议勾选状态监听
        const checkAgreements = () => {
            const phoneChecked = document.getElementById('agree-user').checked && document.getElementById('agree-privacy').checked;
            const emailChecked = document.getElementById('agree-user-email').checked && document.getElementById('agree-privacy-email').checked;
            document.getElementById('phone-submit').disabled = !phoneChecked;
            document.getElementById('email-submit').disabled = !emailChecked;
        };
        
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', checkAgreements);
        });
        
        // 发送验证码
        document.getElementById('btn-send-code').addEventListener('click', function() {
            const phone = document.getElementById('phone').value.trim();
            const errorEl = document.getElementById('phone-error');
            const btn = this;
            
            if (!validators.phone(phone)) {
                showError('phone-error');
                return;
            }
            
            // 检查同一手机号1小时内5次限制
            const now = Date.now();
            if (mockBackend.sendCodeCount[phone]) {
                const count = mockBackend.sendCodeCount[phone].filter(t => now - t < 3600000);
                if (count.length >= 5) {
                    showMessage('该手机号获取验证码次数超限，请1小时后再试', 'error');
                    return;
                }
                mockBackend.sendCodeCount[phone] = count;
            }
            
            // 检查60秒防刷
            if (mockBackend.lastSendTime[phone] && now - mockBackend.lastSendTime[phone] < 60000) {
                showMessage('请稍后再试', 'error');
                return;
            }
            
            // 生成验证码
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            mockBackend.smsCodes[phone] = { code, expire: now + 300000 };
            mockBackend.lastSendTime[phone] = now;
            if (!mockBackend.sendCodeCount[phone]) mockBackend.sendCodeCount[phone] = [];
            mockBackend.sendCodeCount[phone].push(now);
            
            // 倒计时
            btn.disabled = true;
            btn.classList.add('counting');
            let countdown = 60;
            btn.textContent = `${countdown}秒后重试`;
            
            const timer = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.classList.remove('counting');
                    btn.textContent = '获取验证码';
                } else {
                    btn.textContent = `${countdown}秒后重试`;
                }
            }, 1000);
            
            // 模拟发送（实际不发送，仅日志）
            console.log(`[SMS] 验证码 ${code} 已发送至 ${phone}`);
            showMessage('验证码已发送（控制台查看）', 'success');
        });
        
        // 协议弹窗
        document.querySelectorAll('.link[data-type]').forEach(link => {
            link.addEventListener('click', () => {
                const type = link.dataset.type;
                elements.modalTitle.textContent = type === 'user' ? '用户协议' : '隐私政策';
                elements.modalBody.innerHTML = `
                    <p><strong>${type === 'user' ? '用户协议' : '隐私政策'}内容</strong></p>
                    <p style="margin-top: 12px;">1. 本应用尊重并保护用户隐私...</p>
                    <p style="margin-top: 8px;">2. 用户注册即表示同意以下条款...</p>
                    <p style="margin-top: 8px;">3. 我们会收集必要的用户信息以提供服务...</p>
                `;
                elements.modal.classList.add('show');
            });
        });
        
        elements.modalClose.addEventListener('click', () => elements.modal.classList.remove('show'));
        elements.modal.addEventListener('click', (e) => {
            if (e.target === elements.modal) elements.modal.classList.remove('show');
        });
        
        // 密码可见切换
        document.getElementById('toggle-password').addEventListener('click', function() {
            const pwd = document.getElementById('password');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                this.textContent = '🙈';
            } else {
                pwd.type = 'password';
                this.textContent = '👁';
            }
        });
        
        // 邮箱注册表单提交
        document.getElementById('email-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPwd = document.getElementById('confirm-password').value;
            
            // 验证邮箱
            if (!validators.email(email)) {
                showError('email-error');
                return;
            }
            
            // 检查邮箱已注册
            if (mockBackend.users.some(u => u.email === email)) {
                showMessage('该邮箱已被注册', 'error');
                return;
            }
            
            // 检查邮箱超长
            if (email.length > 256) {
                showMessage('邮箱长度不能超过256个字符', 'error');
                return;
            }
            
            // 验证密码强度
            if (!validators.password(password)) {
                showError('password-error');
                return;
            }
            
            // 验证确认密码
            if (password !== confirmPwd) {
                showError('confirm-error');
                return;
            }
            
            // 创建用户
            const user = { id: Date.now(), email, password, activated: false, createdAt: new Date().toISOString() };
            mockBackend.users.push(user);
            
            console.log(`[USER] 邮箱注册成功: ${email}`);
            showMessage('注册成功！请前往邮箱激活账号', 'success');
            
            setTimeout(() => {
                window.location.href = 'mock-login.html?registered=' + encodeURIComponent(email);
            }, 2000);
        });
        
        // 手机号注册表单提交
        document.getElementById('phone-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const code = document.getElementById('phone-code').value.trim();
            const smsData = mockBackend.smsCodes[phone];
            
            // 检查手机号已注册
            if (mockBackend.users.some(u => u.phone === phone)) {
                showMessage('该手机号已被注册', 'error');
                return;
            }
            
            // 检查验证码
            if (!smsData) {
                showMessage('请先获取验证码', 'error');
                return;
            }
            
            if (Date.now() > smsData.expire) {
                showMessage('验证码已过期，请重新获取', 'error');
                return;
            }
            
            if (smsData.code !== code) {
                // 记录验证失败次数
                if (!mockBackend.verifyAttempts[phone]) mockBackend.verifyAttempts[phone] = { count: 0, time: Date.now() };
                mockBackend.verifyAttempts[phone].count++;
                
                if (mockBackend.verifyAttempts[phone].count >= 3) {
                    showMessage('验证码错误次数过多，请重新获取', 'error');
                    delete mockBackend.smsCodes[phone];
                    return;
                }
                showError('code-error');
                return;
            }
            
            // 创建用户
            const user = { id: Date.now(), phone, activated: true, createdAt: new Date().toISOString() };
            mockBackend.users.push(user);
            delete mockBackend.smsCodes[phone];
            
            console.log(`[USER] 手机号注册成功: ${phone}`);
            showMessage('注册成功！', 'success');
            
            setTimeout(() => {
                window.location.href = 'mock-login.html?registered=' + encodeURIComponent(phone);
            }, 2000);
        });
        
        // 输入校验（实时）
        document.getElementById('phone').addEventListener('input', (e) => {
            if (validators.phone(e.target.value) || e.target.value === '') {
                document.getElementById('phone-error').style.display = 'none';
                e.target.classList.remove('error');
            }
        });
        
        document.getElementById('email').addEventListener('input', (e) => {
            if (validators.email(e.target.value) || e.target.value === '') {
                document.getElementById('email-error').style.display = 'none';
                e.target.classList.remove('error');
            }
        });
        
        document.getElementById('password').addEventListener('input', (e) => {
            const val = e.target.value;
            if (val === '' || (validators.password(val))) {
                document.getElementById('password-error').style.display = 'none';
                e.target.classList.remove('error');
            }
        });
        
        document.getElementById('confirm-password').addEventListener('input', (e) => {
            const pwd = document.getElementById('password').value;
            if (e.target.value === pwd || e.target.value === '') {
                document.getElementById('confirm-error').style.display = 'none';
                e.target.classList.remove('error');
            }
        });
        
        function showError(errorId) {
            document.getElementById(errorId).style.display = 'block';
            document.getElementById(errorId.replace('-error',')).classList.add('error');
        }
        
        function showMessage(text, type) {
            elements.message.textContent = text;
            elements.message.className = 'message ' + type;
        }
        
        function hideMessage() {
            elements.message.className = 'message';
        }
        
        // 第三方登录按钮（模拟）
        document.getElementById('btn-wechat').addEventListener('click', () => {
            showMessage('微信授权中...（模拟）', 'success');
            setTimeout(() => {
                const user = { id: Date.now(), wechat: 'wx_' + Date.now(), activated: true, createdAt: new Date().toISOString() };
                mockBackend.users.push(user);
                showMessage('微信登录成功！', 'success');
            }, 1500);
        });
        
        document.getElementById('btn-apple').addEventListener('click', () => {
            showMessage('Apple授权中...（模拟）', 'success');
            setTimeout(() => {
                const user = { id: Date.now(), apple: 'apple_' + Date.now(), activated: true, createdAt: new Date().toISOString() };
                mockBackend.users.push(user);
                showMessage('Apple登录成功！', 'success');
            }, 1500);
        });
    </script>
</body>
</html>
