<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试中台</title>
    <!--
      字体策略（2026-11-24）：**全部本地化，不再请求任何外网字体**。

      之前这里挂了 4 个外网请求：
        fonts.googleapis.com  css2?family=Geist+JetBrains+Mono
        fonts.googleapis.com  css2?family=Material+Symbols+Outlined
        fonts.gstatic.com     preconnect
        cdn.jsdelivr.net      geist 备用
      内网/弱网环境下这些请求会长时间挂起直到超时。期间图标字体没加载，
      ligature 不生效，`.material-symbols-outlined` 会把图标名当普通文字渲染
      （如 checklist / smart_toy 这样一长串英文），撑破容器与旁边中文叠在一起。

      Material Symbols 已由 npm 包 `material-symbols` 提供
      （src/main.ts 里 `import 'material-symbols/outlined.css'`），
      woff2 会被 Vite 打包进 dist/assets 并带 hash —— 完全本地，无需外网。
      Geist / JetBrains Mono 在 variables.css 里只是首选字体名，
      后面有 'PingFang SC' / system-ui / -apple-system 完整 fallback 链，
      内网环境退到系统字体即可，不影响可读性。

      preload 由 vite 插件在构建时注入（见 vite.config.ts 的 fontPreloadPlugin）：
      字体文件名带 hash，无法在这里硬编码。
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
