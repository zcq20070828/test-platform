<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>文档解析测试</title>
</head>
<body>
  <h1>文档解析测试</h1>
  <button onclick="testExcel()">测试 Excel 文件</button>
  <button onclick="testWord()">测试 Word 文件</button>
  <pre id="result" style="background: #f5f5f5; padding: 16px; max-height: 500px; overflow: auto;"></pre>
  
  <script>
    async function testExcel() {
      const path = '/Users/zhaochengqing/.qclaw/workspace/登录功能数据脱敏测试用例.xlsx';
      const res = await fetch(`/api/fs/read?path=${encodeURIComponent(path)}`);
      const data = await res.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    }
    
    async function testWord() {
      const path = '/Users/zhaochengqing/.qclaw/workspace/backend/node_modules/mammoth/test/test-data/tables.docx';
      const res = await fetch(`/api/fs/read?path=${encodeURIComponent(path)}`);
      const data = await res.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
